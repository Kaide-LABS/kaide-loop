[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loopr"
version = "0.1.0"
description = "loopr -- spec-discipline engine. Interrogates a problem to a real stopping condition before code is written."
requires-python = ">=3.14"
dependencies = ["pydantic>=2.13,<3"]

[project.scripts]
loopr = "loopr.cli:main"

[dependency-groups]
dev = ["mypy>=2.3,<3", "pytest>=8", "pytest-cov>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/loopr"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=loopr --cov-report=term-missing"
